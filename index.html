<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
}

canvas {
    display: block;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

const colors = [
    "red",
    "blue",
    "lime",
    "yellow",
    "cyan",
    "magenta",
    "orange",
    "pink"
];

let i = 0;

function draw() {

    // مسح الشاشة
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let cx = canvas.width / 2;
    let cy = canvas.height / 2;

    // رسم القلب
    for (let j = 0; j < 120; j++) {

        let angle =
        (j + i) * (Math.PI * 2) / 120;

        let x =
        16 * Math.pow(Math.sin(angle), 3) * 12;

        let y =
        (13 * Math.cos(angle)
        - 5 * Math.cos(2 * angle)
        - 2 * Math.cos(3 * angle)
        - Math.cos(4 * angle)) * 12;

        let color =
        colors[(j + i) % colors.length];

        ctx.strokeStyle = color;

        // الخط من الوسط
        ctx.beginPath();

        ctx.moveTo(cx, cy);

        ctx.lineTo(
            cx + x,
            cy - y
        );

        ctx.stroke();

        // نجمة صغيرة
        for (let k = 0; k < 8; k++) {

            let a =
            k * Math.PI / 4;

            ctx.beginPath();

            ctx.moveTo(
                cx + x,
                cy - y
            );

            ctx.lineTo(
                cx + x + Math.cos(a) * 6,
                cy - y + Math.sin(a) * 6
            );

            ctx.stroke();
        }
    }

    // الحركة
    i += 1;

    requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
