<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>For You ❤️</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const colors = ["red", "blue", "lime", "yellow", "cyan", "magenta", "orange", "pink"];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener("resize", resize);

function drawHeart() {
  const w = innerWidth, h = innerHeight;
  const scale = Math.min(w, h) / 40;
  const cx = w / 2;
  const cy = h / 2;

  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, w, h);
  ctx.lineWidth = 1;

  for (let i = 0; i < 120; i++) {
    const angle = i * Math.PI * 2 / 120;
    const x = 16 * Math.pow(Math.sin(angle), 3) * scale;
    const y = (13 * Math.cos(angle)
      - 5 * Math.cos(2 * angle)
      - 2 * Math.cos(3 * angle)
      - Math.cos(4 * angle)) * scale;

    const c = colors[Math.floor(Math.random() * colors.length)];
    ctx.strokeStyle = c;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + x, cy - y);
    ctx.stroke();

    // النجمة فطرف كل خط، بحال كود Turtle
    const ex = cx + x, ey = cy - y;
    ctx.beginPath();
    for (let j = 0; j < 8; j++) {
      const a = j * Math.PI / 4;
      ctx.moveTo(ex, ey);
      ctx.lineTo(ex + Math.cos(a) * 6, ey + Math.sin(a) * 6);
    }
    ctx.stroke();
  }
}

drawHeart();
</script>
</body>
</html>
