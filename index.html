<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

canvas {
    display: block;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

const cx = () => canvas.width / 2;
const cy = () => canvas.height / 2;

ctx.fillStyle = "#ffb6c1";
ctx.font = "bold 8px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";

let scale = 4;
let i = 0;

function animate() {

    // رسم نقطة وحدة من القلب
    const angle = i * (Math.PI * 2) / 120;

    const x =
        16 *
        Math.pow(Math.sin(angle), 3) *
        scale;

    const y =
        (
            13 * Math.cos(angle)
            - 5 * Math.cos(2 * angle)
            - 2 * Math.cos(3 * angle)
            - Math.cos(4 * angle)
        ) *
        scale;

    ctx.fillStyle = "#ffb6c1";

    ctx.fillText(
        "I love you",
        cx() + x,
        cy() - y
    );

    // النقطة اللي جاية
    i++;

    // منين يكمل دورة ديال القلب
    if (i >= 120) {

        i = 0;

        // كيزيد الحجم شوية بشوية
        scale++;

        // من 4 حتى 8
        if (scale > 8) {
            scale = 4;
        }
    }

    // كيبقى يرسم باستمرار بلا مسح القديم
    setTimeout(animate, 30);
}

animate();

</script>

</body>
</html>
